<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — DSD Leads</title>
<link rel="icon" href="/admin/icons/icon-192.png">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f8fafc; color:#0f172a;
         padding:24px; }
  .box { text-align:center; max-width:380px; }
  img { width:84px; height:84px; opacity:.85; }
  h1 { font-size:1.25rem; margin:18px 0 8px; }
  p { font-size:.94rem; line-height:1.6; color:#475569; margin:0 0 20px; }
  button { background:#0d6efd; color:#fff; border:0; border-radius:10px;
           padding:14px 26px; font-size:1rem; font-weight:600; cursor:pointer; min-height:48px; }
  @media (prefers-color-scheme: dark) {
    body { background:#0f172a; color:#e2e8f0; } p { color:#94a3b8; }
  }
</style>
</head>
<body>
  <div class="box">
    <img src="/admin/icons/icon-192.png" alt="">
    <h1>No internet connection</h1>
    <p>Lead data is always loaded fresh from the server, so it can't be shown offline. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
