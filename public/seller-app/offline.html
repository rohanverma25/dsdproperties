<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline — DSD Properties</title>
<link rel="icon" href="/seller-app/icon-192.png">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f4f7fb; color: #1a2235; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 24px calc(24px + env(safe-area-inset-left)) 24px calc(24px + env(safe-area-inset-right));
        text-align: center;
    }
    .box { max-width: 380px; }
    img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 700; color: #011f4b; margin-bottom: 10px; }
    p { font-size: 14px; color: #64748b; line-height: 1.7; margin-bottom: 8px; }
    .note {
        margin-top: 18px; padding: 14px 16px; background: #fff;
        border: 1px solid #e2e8f0; border-radius: 10px;
        font-size: 13px; color: #475569; line-height: 1.7; text-align: left;
    }
    button {
        margin-top: 20px; width: 100%; padding: 13px 24px; font-family: inherit;
        font-size: 15px; font-weight: 600; color: #fff; background: #008080;
        border: none; border-radius: 10px; cursor: pointer;
    }
    button:active { background: #006666; }
</style>
</head>
<body>
    <div class="box">
        <img src="/seller-app/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>This page needs a connection. Check your mobile data or Wi-Fi and try again.</p>

        <div class="note">
            <strong>Your draft is safe.</strong> Anything you had already filled in on the
            listing form was saved on the server as you moved between steps, so you can pick
            up where you left off once you're back online.
        </div>

        <button onclick="location.reload()">Try again</button>
    </div>

    <script>
        // Reload by itself the moment the connection comes back.
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
