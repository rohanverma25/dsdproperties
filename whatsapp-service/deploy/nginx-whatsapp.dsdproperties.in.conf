# nginx site for the WhatsApp gateway.
#
#   sudo cp nginx-whatsapp.dsdproperties.in.conf /etc/nginx/sites-available/whatsapp.dsdproperties.in
#   sudo ln -s /etc/nginx/sites-available/whatsapp.dsdproperties.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d whatsapp.dsdproperties.in     # adds the HTTPS server block
#
# The gateway itself stays on 127.0.0.1:3001; only nginx is public.

# Slows down anyone guessing the API token. Laravel polls /status every few
# seconds, so 10/s with a burst is far above normal use.
limit_req_zone $binary_remote_addr zone=wa_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name whatsapp.dsdproperties.in;

    # Must exceed WA_MAX_MEDIA_MB — the panel uploads photos and documents here.
    client_max_body_size 30m;

    location / {
        limit_req zone=wa_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /push delivers to every subscribed browser in one request.
        proxy_read_timeout 60s;
    }
}
